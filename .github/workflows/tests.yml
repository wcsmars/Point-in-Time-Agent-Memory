name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,plots]'
      - run: python -m pytest
      - run: pit-memory demo --output runs/ci-demo
      - run: >-
          pit-memory study --facts examples/sample-data/sec-facts-sample.jsonl
          --universe examples/universe.txt --output runs/ci-study --bootstrap-samples 50
      - run: pit-memory plot --study runs/ci-study --demo runs/ci-demo --output runs/ci-figures
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Check the installed wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/pit-wheel"
          "$RUNNER_TEMP/pit-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/pit-wheel/bin/pit-memory" --version
          "$RUNNER_TEMP/pit-wheel/bin/pit-memory" demo --output wheel-demo
          "$RUNNER_TEMP/pit-wheel/bin/pit-memory" import-facts \
            "$GITHUB_WORKSPACE/examples/sample-data/sec-facts-sample.jsonl" --db wheel-sample.duckdb
          "$RUNNER_TEMP/pit-wheel/bin/pit-memory" query --db wheel-sample.duckdb --cik 51143 \
            --concept us-gaap:Revenues --as-of 2021-03-15 --period-end 2019-12-31 > wheel-query.json
          "$RUNNER_TEMP/pit-wheel/bin/python" -c "import json; r = json.load(open('wheel-query.json')); assert r['status'] == 'known' and r['fact']['value'] == 77147000000.0, r"

  agent-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev,agent]'
      - run: python -m pip check
      - run: python -m pytest tests/test_claude_agent.py tests/test_cli.py
