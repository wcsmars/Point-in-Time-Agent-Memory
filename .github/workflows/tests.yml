name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev,plots]'
      - run: python -m pytest
      - run: pit-memory demo --output runs/ci-demo
      - run: >-
          pit-memory study --facts examples/sample-data/sec-facts-sample.jsonl
          --universe examples/universe.txt --output runs/ci-study --bootstrap-samples 50
      - run: pit-memory plot --study runs/ci-study --demo runs/ci-demo --output runs/ci-figures
