[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-agent-memory"
version = "0.1.0"
description = "Point-in-time financial fact retrieval and leakage evaluation"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "exchange-calendars>=4.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
pit-memory = "pit_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  # Raised inside exchange-calendars by newer pandas; not from this package.
  "ignore:Series.values returning an ndarray:DeprecationWarning",
  "ignore::FutureWarning:exchange_calendars",
]
