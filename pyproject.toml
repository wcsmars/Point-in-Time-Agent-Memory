[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pit-agent-memory"
version = "0.1.0"
description = "Bitemporal SEC fact store and look-ahead leakage audit for financial research agents"
authors = [{name = "Chung Shing Mars Wong"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["point-in-time", "bitemporal", "look-ahead-bias", "sec-edgar", "quantitative-finance", "retrieval"]
dependencies = ["duckdb>=1.1,<2", "exchange-calendars>=4.5,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
plots = ["matplotlib>=3.7,<4"]
agent = ["claude-agent-sdk==0.1.81", "mcp>=1.19,<2"]

[project.urls]
Homepage = "https://github.com/wcsmars/Point-in-Time-Agent-Memory"

[project.scripts]
pit-memory = "pit_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
  # Raised inside exchange-calendars by newer pandas; not from this package.
  "ignore:Series.values returning an ndarray:DeprecationWarning",
  "ignore::FutureWarning:exchange_calendars",
]
